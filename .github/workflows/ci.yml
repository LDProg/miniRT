name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorg libxext-dev libx11-dev libbsd-dev libxrandr-dev libxrender-dev valgrind

      - name: Make
        run: make --debug=v CFLAGS="-Wall -Wextra"

      - name: Memory leaks
        run: |
          valgrind --leak-check=full ./miniRT scenes/simple.rt 2>&1 | tee valgrind.txt
          ! grep -q "definitely lost" valgrind.txt

      - name: Norminette, just for fun
        continue-on-error: true
        run: |
          pip3 install Norminette
          norminette *.c *.h
