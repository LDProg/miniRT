name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prod-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglfw3-dev libglfw3 xorg-dev libx11-dev libbsd-dev valgrind

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Norminette
        run: |
          python3 -m pip install --upgrade pip
          pip install norminette==3.3.55

      - name: Make
        run: make

      - name: Norminette
        run: norminette

      - name: Memory leaks
        run: |
          valgrind --leak-check=full --show-leak-kinds=all ./miniRT scenes/complex.rt 2>&1 | tee valgrind.txt
          ! grep -q "definitely lost" valgrind.txt
